<!DOCTYPE html>

<html>

<head>

    <title>{{ destination }} Trip</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>


</head>

<body>

<nav>

    <a href="{{ url_for('main.home') }}" style="text-decoration: none; color: #000;">
        <h2>
            TravelMind AI
        </h2>
    </a>

    <div>
        {% if logged_in %}

        <span class="welcome-user" style="margin-right: 15px;">

            👋 {{ username }}

        </span>

        <a href="{{ url_for('account.account_page') }}">
            <button class="logout-button">
                👤 Account
            </button>
        </a>

        {% else %}

        <a href="/register">
            <button class="logout-button">Register</button>
        </a>

        <a href="/login">
            <button class="logout-button">Login</button>
        </a>

        {% endif %}

    </div>

</nav>

{% if image_url %}

<img 
    src="{{ image_url }}"
    class="trip-result-image"
>

{% endif %}

{% include "_trip_details.html" %}



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const locations = {{ map_locations | tojson }};

var map = L.map("trip-map");


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "© OpenStreetMap contributors"
    }
).addTo(map);



var bounds = [];
var routeCoordinates = [];


// Custom icons

var startIcon = L.icon({

    iconUrl:
    "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",

    shadowUrl:
    "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",

    iconSize: [25, 41],

    iconAnchor: [12, 41],

    popupAnchor: [1, -34]

});


var stopIcon = L.icon({

    iconUrl:
    "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png",

    shadowUrl:
    "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",

    iconSize: [25, 41],

    iconAnchor: [12, 41],

    popupAnchor: [1, -34]

});


var endIcon = L.icon({

    iconUrl:
    "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png",

    shadowUrl:
    "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",

    iconSize: [25, 41],

    iconAnchor: [12, 41],

    popupAnchor: [1, -34]

});



locations.forEach(function(location, index) {


    var icon = stopIcon;


    if (index === 0) {

        icon = startIcon;

    }


    else if (index === locations.length - 1) {

        icon = endIcon;

    }



    L.marker(

        [location.lat, location.lon],

        {
            icon: icon
        }

    )

    .addTo(map)


    .bindPopup(

        `
        ${location.day === 0 ? 
            "<b>Starting Location</b><br>" :
            "<b>Day " + location.day + "</b><br>"
        }

        ${location.time}<br><br>

        <b>${location.place}</b><br>

        ${location.activity}

        `

    );



    bounds.push([

        location.lat,

        location.lon

    ]);



    routeCoordinates.push([

        location.lat,

        location.lon

    ]);



});





if (routeCoordinates.length > 1) {


    const roadRoute = {{ route_coordinates | tojson }};

    if (roadRoute.length > 1) {

        L.polyline(
            roadRoute,
            {
                color: "#2563eb",
                weight: 5,
                opacity: 0.9
            }
        ).addTo(map);

    }

}



if (bounds.length > 0) {


    map.fitBounds(

        bounds,

        {

            padding: [40,40]

        }

    );


}



</script>

</body>

</html>
