<!DOCTYPE html>

<html>

<head>

    <title>{{ destination }} Trip</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body>

<nav>

    <a href="{{ url_for('main.home') }}" style="text-decoration: none; color: #000;">
        <h2>
            TravelMind AI
        </h2>
    </a>

    <div>
        {% if logged_in %}

        <span class="welcome-user" style="margin-right: 15px;">

            👋 {{ username }}

        </span>

        <a href="{{ url_for('account.account_page') }}">
            <button class="logout-button">
                👤 Account
            </button>
        </a>

        {% else %}

        <a href="/register">
            <button class="logout-button">Register</button>
        </a>

        <a href="/login">
            <button class="logout-button">Login</button>
        </a>

        {% endif %}

    </div>

</nav>

{% if image_url %}

<img 
    src="{{ image_url }}"
    class="trip-result-image"
>

{% endif %}

{% include "_trip_details.html" %}



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

var originLat = {{ origin_lat|tojson }};
var originLon = {{ origin_lon|tojson }};

var destinationLat = {{ destination_lat|tojson }};
var destinationLon = {{ destination_lon|tojson }};

if (
    originLat &&
    originLon &&
    destinationLat &&
    destinationLon
) {

    var map = L.map('trip-map');

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '© OpenStreetMap contributors'
        }
    ).addTo(map);

    // Origin marker
    var originMarker = L.marker([originLat, originLon])
        .addTo(map)
        .bindPopup("🟢 {{ origin }}");

    // Destination marker
    var destinationMarker = L.marker([destinationLat, destinationLon])
        .addTo(map)
        .bindPopup("🔴 {{ destination }}");

    // Route line
    var route = L.polyline(
        [
            [originLat, originLon],
            [destinationLat, destinationLon]
        ],
        {
            color: "blue",
            weight: 4
        }
    ).addTo(map);

    // Automatically zoom to show both markers
    map.fitBounds(route.getBounds(), {
        padding: [40, 40]
    });

}

</script>

</body>

</html>
