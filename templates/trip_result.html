<!DOCTYPE html>

<html>

<head>

    <title>{{ destination }} Trip</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav>

    <h2>TravelMind AI 🌎</h2>

    <div>
            {% if logged_in %}

            <span class="welcome-user">

                👋 {{ username }}

            </span>

            <a href="/trips">
                <button>My Trips</button>
            </a>

            <a href="/logout">
                <button class="logout-button">
                    Logout
                </button>
            </a>

            {% else %}

            <a href="/register">
                <button>Register</button>
            </a>

            <a href="/login">
                <button>Login</button>
            </a>

            {% endif %}

        </div>

</nav>

{% if image_url %}

<img 
    src="{{ image_url }}"
    class="trip-result-image"
>

{% endif %}

{% include "_trip_details.html" %}

</body>

</html>
