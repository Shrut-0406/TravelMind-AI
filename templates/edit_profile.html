<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Edit Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/edit_profile.css') }}">

</head>

<body>

<div class="container">

    <h1>Edit Profile</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}

            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}

        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            value="{{ user.username }}"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            required
        >

        <hr>

        <h2>Change Password</h2>

        <label>Current Password</label>

        <input
            type="password"
            name="current_password"
        >

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

    <a class="back" href="{{ url_for('account.account_page') }}">
        ← Back to Account
    </a>

</div>

</body>
</html>
